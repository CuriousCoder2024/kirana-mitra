<!doctype html><html><head><meta charset="utf-8"><title>Caption</title><link rel="stylesheet" href="common.css">
<style>
html, body { background: transparent; }
.cap { position: absolute; bottom: 34px; display: flex; justify-content: center; }
.cap.wide { left: 80px; width: 1120px; } .cap.right { left: 520px; width: 700px; }

  font-family: "Noto Sans", "Noto Sans Devanagari", sans-serif; box-shadow: 0 4px 18px rgba(0,0,0,.25); }

<div class="cap" id="cap"><span id="t"></span></div>

</div></body></html>
